<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Break Admin</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/main.css">
</head>
<body>
    <div class="header">
        <div class="flex gap-md align-center">
            <h1 class="brand-title"><a href="/" class="brand-link">Cinematic Break</a></h1>
        </div>
        <div class="flex gap-md align-center">
            <a href="/settings" class="icon-link" title="Settings" aria-label="Settings">
                <i data-lucide="settings"></i>
            </a>
            <a href="/logout" class="icon-link" title="Logout" aria-label="Logout">
                <i data-lucide="log-out"></i>
            </a>
        </div>
    </div>
    
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Modal for new session -->
    <div id="sessionModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h2 class="modal-title">Start New Session</h2>
                <button type="button" class="modal-close" onclick="closeModal()" aria-label="Close modal">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="sessionForm" method="POST" action="/sessions">
                    <input type="hidden" id="movie_title_input" name="movie_title" value="">
                    
                    <div class="form-group">
                        <label class="form-label" for="movie_title_display">Movie</label>
                        <input type="text" id="movie_title_display" disabled>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="session_name">Session Name (Optional)</label>
                        <input type="text" id="session_name" name="session_name" placeholder="e.g. Evening Showing">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="theater_number">Theater Number (Optional)</label>
                        <input type="text" id="theater_number" name="theater_number" placeholder="e.g. 5">
                    </div>

                    <div class="button-group">
                        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                        <button type="submit" class="btn">Create Session</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('sessionModal');
        const titleInput = document.getElementById('movie_title_input');
        const titleDisplay = document.getElementById('movie_title_display');

        function openModal(title) {
            titleInput.value = title;
            titleDisplay.value = title;
            modal.classList.add('show');
            document.getElementById('session_name').focus();
        }

        function closeModal() {
            modal.classList.remove('show');
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
    <script src="/static/lucide.min.js"></script>
    <script>
        if (window.lucide) {
            lucide.createIcons();
        }
    </script>
</body>
</html>
