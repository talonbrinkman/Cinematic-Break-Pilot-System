{% extends "base.html" %}

{% block content %}
<div class="join-container">
    <h1 class="page-title text-center mb-20">{{ session.movie_title }}</h1>

    <div class="join-box">
        <form method="POST" action="/join/{{ session.join_code }}">
            {% if error %}
            <div class="error-msg">
                {{ error }}
            </div>
            {% endif %}
            <div class="form-group mb-20">
                <label for="ticket_number" class="form-label text-center">Enter 6-Digit Ticket Number</label>
                <input type="text" id="ticket_number" name="ticket_number" required class="join-input"
                    placeholder="XXXXXX" maxlength="6" autofocus autocomplete="off" autocorrect="off"
                    autocapitalize="characters" spellcheck="false">
            </div>
            <button type="submit" class="btn btn-primary w-100">Join Session</button>
        </form>
    </div>
</div>
{% endblock %}
