<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Cinematic Break</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/main.css">
</head>
<body class="center-screen">
    <div class="join-box">
        <h1 class="brand-title text-center mb-8">Cinematic Break</h1>
        <p class="text-center mb-20">Sign in to access admin dashboard.</p>

        {% if setup_success %}
        <div class="notice-success mb-20">Admin account created! Please sign in.</div>
        {% endif %}

        {% if error %}
        <div class="error-msg mb-20">{{ error }}</div>
        {% endif %}

        <form action="/login" method="post" id="loginForm">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" name="username" id="username" required autocomplete="username" autofocus>
            </div>

            <div class="form-group mb-20">
                <label for="password" class="form-label">Password</label>
                <div class="password-field">
                    <input type="password" name="password" id="password" required autocomplete="current-password">
                    <div class="password-toggle" onclick="toggleVisibility('password', this)" title="Toggle visibility" aria-label="Toggle password visibility">
                        <i data-lucide="eye"></i>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </form>
    </div>

    <script src="/static/lucide.min.js"></script>
    <script>
        function toggleVisibility(inputId, trigger) {
            const input = document.getElementById(inputId);
            const btn = typeof trigger === 'string' ? document.getElementById(trigger) : trigger;
            if (!input || !btn) return;
            const toggleBtn = btn.classList.contains('password-toggle') ? btn : btn.closest('.password-toggle') || btn;
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            const iconName = isPassword ? 'eye-off' : 'eye';
            toggleBtn.innerHTML = `<i data-lucide="${iconName}"></i>`;
            if (window.lucide) {
                lucide.createIcons();
            }
        }

        if (window.lucide) {
            lucide.createIcons();
        }
    </script>
</body>
</html>
