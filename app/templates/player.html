<html>

<head>
    <title>Cinematic Break • {{ session.movie_title }}</title>
    <link rel="icon" href="data:,">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="/static/main.css">
</head>

<body class="player-body">
    <div class="player-container" id="playerContainer">
    <video id="mediaPlayer" class="player-video" playsinline webkit-playsinline crossorigin="anonymous">
        Your browser does not support HTML video.
    </video>

    <div id="loadingSpinner" class="loading-spinner">
        <i data-lucide="loader-circle"></i>
    </div>

    {% if ticket_number %}
    <div id="watermark" class="watermark-deterrent">
        <span class="watermark-label">LIVE STREAM MONITORED</span>
        <span class="watermark-divider">|</span>
        <span class="watermark-ticket-num">TICKET #{{ ticket_number }}</span>
    </div>
    {% endif %}

    <div id="playerOverlay" class="player-overlay pointer-events-none">
        <div class="pointer-events-auto player-header">
            <div class="flex-1">
                <h1 class="player-title">{{ session.movie_title }}</h1>
                {% if session.theater_number and session.theater_number != 'None' %}
                <div class="player-subtitle">Theater {{ session.theater_number }}</div>
                {% endif %}
            </div>
            <a href="#" onclick="window.close(); window.location.href='/'; return false;" class="player-close-btn"
                title="Close Player">
                <i data-lucide="x"></i>
            </a>
        </div>

        <div class="player-controls pointer-events-auto">


            <div class="controls-row">
                <div class="controls-left">
                    <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
                </div>

                <div class="controls-center">
                    <button class="control-btn play-btn-large" id="playPauseBtn">
                        <i data-lucide="pause" id="playIcon"></i>
                    </button>
                </div>

                <div class="controls-right">
                    <div class="volume-container flex align-center gap-xs">
                        <button class="control-btn" id="muteBtn" onclick="toggleMute()">
                            <i data-lucide="volume-2" id="volumeIcon"></i>
                        </button>
                        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05"
                            value="1">
                    </div>
                    <button class="control-btn" id="aspectRatioBtn" onclick="toggleAspectRatio()"
                        title="Aspect Ratio: Fit">
                        <i data-lucide="rectangle-horizontal"></i>
                    </button>
                    <button class="control-btn" id="fullscreenBtn">
                        <i data-lucide="maximize"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        lucide.createIcons();

        const video = document.getElementById('mediaPlayer');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const playBtn = document.getElementById('playPauseBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const muteBtn = document.getElementById('muteBtn');

        let serverElapsed = parseInt("{{ session.elapsed_seconds }}", 10) || 0;
        let lastSyncLocalTime = Date.now();
        const duration = parseInt("{{ session.duration_seconds }}", 10) || 7200;
        let isAdminPaused = {{ 'true' if session.is_paused else 'false' }};

        let hasInitiallySeeked = false;

        function getLiveTime() {
            let actualDur = duration;
            if (video.duration && !isNaN(video.duration) && video.duration !== Infinity) {
                actualDur = Math.min(duration, video.duration);
            }
            if (isAdminPaused) {
                return Math.max(0, Math.min(actualDur, serverElapsed));
            }
            const now = Date.now();
            return Math.max(0, Math.min(actualDur, serverElapsed + (now - lastSyncLocalTime) / 1000));
        }

        const useHls = {{ 'true' if use_hls else 'false' }};
        const streamUrl = "/stream/{{ session.join_code }}";
        let hls = null;

        if (useHls) {
            function initHls() {
                const hlsUrl = `/static/hls/{{ session.id }}/index.m3u8?t=${Date.now()}`;
                if (Hls.isSupported()) {
                    hls = new Hls({
                        startPosition: getLiveTime(),
                        manifestLoadingMaxRetry: 10,
                        manifestLoadingRetryDelay: 1000,
                        manifestLoadingTimeOut: 10000
                    });

                    let recoverDecodingErrorDate = null;
                    hls.on(Hls.Events.ERROR, function (event, data) {
                        if (data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    console.log("fatal network error encountered, try to recover");
                                    hls.startLoad();
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    console.log("fatal media error encountered, try to recover");
                                    const now = performance.now();
                                    if (!recoverDecodingErrorDate || (now - recoverDecodingErrorDate) > 3000) {
                                        recoverDecodingErrorDate = performance.now();
                                        hls.recoverMediaError();
                                    } else {
                                        console.error("Unrecoverable media error - destroying player");
                                        hls.destroy();
                                    }
                                    break;
                                default:
                                    hls.destroy();
                                    break;
                            }
                        }
                    });

                    hls.loadSource(hlsUrl);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function () {
                        if (!hasInitiallySeeked) {
                            hasInitiallySeeked = true;
                            video.play().catch(e => console.log("Auto-play prevented", e));
                        }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = hlsUrl;
                    video.addEventListener('loadedmetadata', () => {
                        if (!hasInitiallySeeked) {
                            video.currentTime = getLiveTime();
                            hasInitiallySeeked = true;
                            video.play().catch(e => console.log("Auto-play prevented", e));
                        }
                    });
                }
            }

            // Poll until the manifest is generated by ffmpeg
            function waitForManifest() {
                const checkUrl = `/static/hls/{{ session.id }}/index.m3u8?t=${Date.now()}`;
                fetch(checkUrl, { method: 'HEAD', cache: 'no-store' })
                    .then(response => {
                        if (response.ok) {
                            initHls();
                        } else {
                            setTimeout(waitForManifest, 1000);
                        }
                    })
                    .catch(() => setTimeout(waitForManifest, 1000));
            }
            waitForManifest();
        } else {
            video.src = streamUrl + "#t=" + getLiveTime();
            video.addEventListener('loadedmetadata', () => {
                if (!hasInitiallySeeked) {
                    video.currentTime = getLiveTime();
                    hasInitiallySeeked = true;
                    video.play().catch(e => console.log("Auto-play prevented", e));
                }
            });
        }

        video.addEventListener('waiting', () => loadingSpinner.style.opacity = '1');
        video.addEventListener('playing', () => loadingSpinner.style.opacity = '0');
        video.addEventListener('canplay', () => loadingSpinner.style.opacity = '0');

        function togglePlay() {
            if (isAdminPaused) return; // Ignore user play/pause if admin paused
            if (video.paused) {
                // Ensure we don't play past live time and resync
                if (typeof seekFailed === 'undefined' || !seekFailed) {
                    const live = getLiveTime();
                    if (Math.abs(video.currentTime - live) > 2) {
                        video.currentTime = live;
                    }
                }
                video.play();
            } else {
                video.pause();
            }
        }

        playBtn.addEventListener('click', togglePlay);
        video.addEventListener('click', togglePlay);

        video.addEventListener('play', () => {
            playBtn.innerHTML = '<i data-lucide="pause"></i>';
            lucide.createIcons();
        });
        video.addEventListener('pause', () => {
            playBtn.innerHTML = '<i data-lucide="play"></i>';
            lucide.createIcons();
        });

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return "0:00";
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        let lastSyncTime = 0;
        let seekFailed = false;

        // Live syncing check
        video.addEventListener('timeupdate', () => {
            if (seekFailed) return;

            const liveTime = getLiveTime();
            let actualDur = duration;

            if (liveTime >= actualDur - 1) return;

            // Force sync if we deviate by more than 5 seconds from server live time
            if (!video.paused && !video.seeking && Math.abs(video.currentTime - liveTime) > 5) {
                if (Date.now() - lastSyncTime > 10000) {
                    const targetTime = liveTime;
                    video.currentTime = targetTime;
                    lastSyncTime = Date.now();

                    setTimeout(() => {
                        if (!video.seeking && Math.abs(video.currentTime - targetTime) > 5) {
                            console.warn("Seek failed. Disabling live sync to prevent loop.");
                            seekFailed = true;
                        }
                    }, 3000);
                }
            }

            // Always show LIVE
            timeDisplay.innerHTML = `${formatTime(video.currentTime)} / ${formatTime(actualDur)} <span class="live-indicator">• LIVE</span>`;
        });

        volumeSlider.addEventListener('input', (e) => {
            video.volume = e.target.value;
            video.muted = video.volume === 0;
            updateVolumeIcon();
        });

        function toggleMute() {
            video.muted = !video.muted;
            if (video.muted) {
                volumeSlider.value = 0;
            } else {
                if (video.volume === 0) video.volume = 1;
                volumeSlider.value = video.volume;
            }
            updateVolumeIcon();
        }

        function updateVolumeIcon() {
            let icon = 'volume-2';
            if (video.muted || video.volume == 0) icon = 'volume-x';
            else if (video.volume < 0.5) icon = 'volume-1';
            muteBtn.innerHTML = `<i data-lucide="${icon}"></i>`;
            lucide.createIcons();
        }

        function isFullscreen() {
            return Boolean(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement ||
                document.msFullscreenElement ||
                (video && video.webkitDisplayingFullscreen)
            );
        }

        function updateFullscreenUI() {
            const isFs = isFullscreen();
            const icon = isFs ? 'minimize' : 'maximize';
            fullscreenBtn.innerHTML = `<i data-lucide="${icon}"></i>`;
            if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
        }

        function toggleFullscreen() {
            if (isFullscreen()) {
                try {
                    if (document.exitFullscreen) {
                        const p = document.exitFullscreen();
                        if (p && typeof p.catch === 'function') p.catch(() => {});
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    } else if (document.mozCancelFullScreen) {
                        document.mozCancelFullScreen();
                    } else if (document.msExitFullscreen) {
                        document.msExitFullscreen();
                    } else if (video && typeof video.webkitExitFullscreen === 'function') {
                        video.webkitExitFullscreen();
                    }
                } catch (e) {
                    if (video && typeof video.webkitExitFullscreen === 'function') {
                        video.webkitExitFullscreen();
                    }
                }
            } else {
                const isIPhone = /iPhone|iPod/.test(navigator.userAgent);
                const containerEl = document.getElementById('playerContainer') || document.documentElement;

                // On iPhone (including Firefox and Safari on iOS), Element.requestFullscreen is unsupported or rejected.
                // video.webkitEnterFullscreen() must be triggered synchronously within the user gesture.
                if (isIPhone || (!document.fullscreenEnabled && video && typeof video.webkitEnterFullscreen === 'function')) {
                    if (video && typeof video.webkitEnterFullscreen === 'function') {
                        try {
                            video.webkitEnterFullscreen();
                        } catch (err) {
                            console.warn("video.webkitEnterFullscreen error:", err);
                        }
                    }
                    setTimeout(updateFullscreenUI, 100);
                    return;
                }

                try {
                    if (typeof containerEl.requestFullscreen === 'function') {
                        const p = containerEl.requestFullscreen();
                        if (p && typeof p.catch === 'function') {
                            p.catch(err => {
                                console.warn("Fullscreen request rejected, trying video.webkitEnterFullscreen:", err);
                                if (video && typeof video.webkitEnterFullscreen === 'function') {
                                    video.webkitEnterFullscreen();
                                }
                            });
                        }
                    } else if (typeof document.documentElement.requestFullscreen === 'function') {
                        const p = document.documentElement.requestFullscreen();
                        if (p && typeof p.catch === 'function') {
                            p.catch(err => {
                                if (video && typeof video.webkitEnterFullscreen === 'function') {
                                    video.webkitEnterFullscreen();
                                }
                            });
                        }
                    } else if (typeof containerEl.webkitRequestFullscreen === 'function') {
                        containerEl.webkitRequestFullscreen();
                    } else if (typeof document.documentElement.webkitRequestFullscreen === 'function') {
                        document.documentElement.webkitRequestFullscreen();
                    } else if (video && typeof video.webkitEnterFullscreen === 'function') {
                        video.webkitEnterFullscreen();
                    }
                } catch (err) {
                    console.warn("Fullscreen request error, trying video.webkitEnterFullscreen:", err);
                    if (video && typeof video.webkitEnterFullscreen === 'function') {
                        video.webkitEnterFullscreen();
                    }
                }
            }
            setTimeout(updateFullscreenUI, 100);
        }

        fullscreenBtn.addEventListener('click', toggleFullscreen);

        document.addEventListener('fullscreenchange', updateFullscreenUI);
        document.addEventListener('webkitfullscreenchange', updateFullscreenUI);
        document.addEventListener('mozfullscreenchange', updateFullscreenUI);
        document.addEventListener('MSFullscreenChange', updateFullscreenUI);

        if (video) {
            video.addEventListener('webkitbeginfullscreen', updateFullscreenUI);
            video.addEventListener('webkitendfullscreen', updateFullscreenUI);
        }

        const overlay = document.getElementById('playerOverlay');
        let hideTimeout;
        function showOverlay() {
            overlay.style.opacity = '1';
            document.body.style.cursor = 'default';
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                if (!video.paused) {
                    overlay.style.opacity = '0';
                    document.body.style.cursor = 'none';
                }
            }, 3000);
        }
        document.addEventListener('mousemove', showOverlay);
        video.addEventListener('pause', showOverlay);
        showOverlay();

        const aspectModes = ['contain', 'cover', 'fill'];
        const aspectNames = ['Fit', 'Crop', 'Stretch'];
        let currentAspect = 0;

        function toggleAspectRatio() {
            currentAspect = (currentAspect + 1) % aspectModes.length;
            video.style.objectFit = aspectModes[currentAspect];
            const btn = document.getElementById('aspectRatioBtn');
            btn.title = 'Aspect Ratio: ' + aspectNames[currentAspect];
        }

        // Prevent default spacebar scrolling and use for play/pause
        window.addEventListener('keydown', function (e) {
            if (e.keyCode == 32 && e.target == document.body) {
                e.preventDefault();
                togglePlay();
            }
        });

        // Admin pause overlay
        const adminPauseOverlay = document.createElement('div');
        adminPauseOverlay.className = 'admin-pause-overlay';
        adminPauseOverlay.innerHTML = '<i data-lucide="pause-circle" class="admin-pause-icon"></i> Session Paused by Admin';
        adminPauseOverlay.style.display = 'none';
        document.getElementById('playerOverlay').appendChild(adminPauseOverlay);
        lucide.createIcons();

        function updateAdminPauseState(paused) {
            isAdminPaused = paused;
            if (paused) {
                video.pause();
                adminPauseOverlay.style.display = 'flex';
                playBtn.disabled = true;
                playBtn.style.opacity = '0.5';
            } else {
                adminPauseOverlay.style.display = 'none';
                playBtn.disabled = false;
                playBtn.style.opacity = '1';
                // re-sync video to new live time
                video.currentTime = getLiveTime();
                video.play().catch(e => console.log("Auto-play prevented", e));
            }
        }

        if (isAdminPaused) {
            updateAdminPauseState(true);
        }

        let isPlaybackTerminated = false;
        let pollIntervalId = null;
        let watermarkObserver = null;

        function terminatePlayback(title, message, iconName = 'shield-alert') {
            if (isPlaybackTerminated) return;
            isPlaybackTerminated = true;

            // 1. Immediately pause and mute the video element
            try {
                if (video) {
                    video.pause();
                    video.muted = true;
                    video.src = '';
                    video.removeAttribute('src');
                    video.load();
                }
            } catch (e) {
                console.error("Error stopping video playback:", e);
            }

            // 2. Destroy Hls instance if present
            try {
                if (hls) {
                    hls.stopLoad();
                    hls.detachMedia();
                    hls.destroy();
                    hls = null;
                }
            } catch (e) {
                console.error("Error destroying HLS instance:", e);
            }

            // 3. Exit fullscreen if active (especially iOS native player)
            try {
                if (document.fullscreenElement && document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (video && typeof video.webkitExitFullscreen === 'function') {
                    video.webkitExitFullscreen();
                }
            } catch (e) {}

            // 4. Disconnect observer and stop polling
            try {
                if (watermarkObserver) {
                    watermarkObserver.disconnect();
                    watermarkObserver = null;
                }
            } catch (e) {}

            try {
                if (watermarkWatchdog) {
                    clearInterval(watermarkWatchdog);
                    watermarkWatchdog = null;
                }
            } catch (e) {}

            try {
                if (pollIntervalId) {
                    clearInterval(pollIntervalId);
                    pollIntervalId = null;
                }
            } catch (e) {}

            // 5. Update UI overlay
            document.body.innerHTML = `
                <div class="session-ended-overlay">
                    <i data-lucide="${iconName}" class="icon-large"></i>
                    <h2 class="ended-title">${title}</h2>
                    <p>${message}</p>
                </div>
            `;
            if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
        }

        let latencyHistory = [];
        const MAX_HISTORY = 5;

        pollIntervalId = setInterval(async () => {
            try {
                const requestStart = Date.now();
                const res = await fetch(`/sessions/{{ session.id }}/state`, { credentials: 'same-origin' });

                if (res.ok) {
                    const data = await res.json();
                    const requestEnd = Date.now();
                    const wasPaused = isAdminPaused;

                    const rtt = requestEnd - requestStart;
                    const oneWayLatency = rtt / 2;

                    latencyHistory.push(oneWayLatency);
                    if (latencyHistory.length > MAX_HISTORY) latencyHistory.shift();
                    const avgLatency = latencyHistory.reduce((a, b) => a + b, 0) / latencyHistory.length;

                    console.log(`[Sync] RTT: ${rtt}ms | One-Way Latency: ${oneWayLatency}ms | Smoothed Avg Latency: ${Math.round(avgLatency)}ms`);

                    serverElapsed = data.elapsed_seconds + (avgLatency / 1000);
                    lastSyncLocalTime = requestEnd;

                    if (data.is_paused !== wasPaused) {
                        updateAdminPauseState(data.is_paused);
                    } else if (!data.is_paused) {
                        const live = getLiveTime();
                        if (!video.paused && !video.seeking && Math.abs(video.currentTime - live) > 5) {
                            video.currentTime = live;
                        }
                    }
                } else if (res.status === 403) {
                    const data = await res.json().catch(() => ({}));
                    terminatePlayback("Access Revoked", data.detail || "Your access has been terminated.", "shield-alert");
                } else if (res.status === 404) {
                    const data = await res.json().catch(() => ({}));
                    terminatePlayback("Session Ended", data.detail || "This session has been terminated by the administrator.", "video-off");
                }
            } catch (e) {
                console.error("Failed to poll session state", e);
            }
        }, 5000);

        // Bouncing Watermark & Anti-Tamper
        const ticketNum = "{{ ticket_number }}";
        const watermarkEl = document.getElementById('watermark');
        const container = document.getElementById('playerContainer');
        let watermarkWatchdog = null;

        function triggerTamperBan(reason) {
            if (isPlaybackTerminated) return;
            console.warn("Watermark tampering detected:", reason);
            if (navigator.sendBeacon) {
                navigator.sendBeacon('/sessions/{{ session.id }}/ban');
            } else {
                fetch('/sessions/{{ session.id }}/ban', { method: 'POST' }).catch(() => {});
            }
            terminatePlayback("Access Revoked", "Ticket banned for watermark tampering.", "shield-alert");
        }

        function checkWatermarkIntegrity() {
            if (isPlaybackTerminated) return;
            const wm = document.getElementById('watermark');
            if (!wm || !wm.isConnected) {
                triggerTamperBan("Element removed or disconnected");
                return;
            }

            if (wm.parentElement !== container) {
                triggerTamperBan("Element reparented");
                return;
            }

            if (!wm.classList.contains('watermark-deterrent')) {
                triggerTamperBan("Class tampered");
                return;
            }

            // Verify content integrity
            const text = wm.textContent || "";
            if (!text.includes(ticketNum) || !text.includes("LIVE STREAM MONITORED")) {
                triggerTamperBan("Content modified");
                return;
            }

            // Verify inline style restrictions: our code ONLY sets top: 0, left: 0, and transform
            const inlineStyle = wm.style;
            if (inlineStyle.opacity !== '' && inlineStyle.opacity !== undefined) {
                triggerTamperBan("Inline opacity style modified");
                return;
            }
            if (inlineStyle.display !== '' && inlineStyle.display !== undefined) {
                triggerTamperBan("Inline display style modified");
                return;
            }
            if (inlineStyle.visibility !== '' && inlineStyle.visibility !== undefined) {
                triggerTamperBan("Inline visibility style modified");
                return;
            }
            if (inlineStyle.filter !== '' && inlineStyle.filter !== undefined) {
                triggerTamperBan("Inline filter style modified");
                return;
            }
            if (inlineStyle.clipPath || inlineStyle.clip) {
                triggerTamperBan("Inline clip style modified");
                return;
            }
            if (inlineStyle.width || inlineStyle.height || inlineStyle.fontSize) {
                triggerTamperBan("Inline dimensions/font style modified");
                return;
            }

            // Verify computed styles
            const cs = window.getComputedStyle(wm);
            if (!cs) {
                triggerTamperBan("Computed style inaccessible");
                return;
            }

            const computedOpacity = parseFloat(cs.opacity);
            if (isNaN(computedOpacity) || computedOpacity < 0.7) {
                triggerTamperBan("Computed opacity below threshold");
                return;
            }

            if (cs.display === 'none') {
                triggerTamperBan("Computed display is none");
                return;
            }

            if (cs.visibility !== 'visible') {
                triggerTamperBan("Computed visibility is not visible");
                return;
            }

            // Verify bounding box dimensions
            const rect = wm.getBoundingClientRect();
            if (rect.width < 50 || rect.height < 15) {
                triggerTamperBan("Dimensions collapsed");
                return;
            }

            // Verify child spans
            const ticketSpan = wm.querySelector('.watermark-ticket-num');
            if (!ticketSpan || !ticketSpan.textContent.includes(ticketNum)) {
                triggerTamperBan("Ticket number span missing or altered");
                return;
            }
            const labelSpan = wm.querySelector('.watermark-label');
            if (!labelSpan || !labelSpan.textContent.includes("LIVE STREAM MONITORED")) {
                triggerTamperBan("Watermark label span missing or altered");
                return;
            }
            const csTicket = window.getComputedStyle(ticketSpan);
            if (csTicket.display === 'none' || csTicket.visibility !== 'visible' || parseFloat(csTicket.opacity) < 0.7) {
                triggerTamperBan("Ticket text hidden or faded");
                return;
            }
        }

        if (ticketNum && watermarkEl && container) {
            watermarkEl.style.top = '0';
            watermarkEl.style.left = '0';

            let posX = 20;
            let posY = 20;
            let speedX = 1.0;
            let speedY = 0.7;

            function patrolWatermark() {
                if (isPlaybackTerminated) return;
                checkWatermarkIntegrity();
                if (isPlaybackTerminated) return;

                const boundsW = container.clientWidth;
                const boundsH = container.clientHeight;
                const wmW = watermarkEl.offsetWidth;
                const wmH = watermarkEl.offsetHeight;

                if (boundsW > wmW) {
                    if (posX + wmW >= boundsW) speedX = -Math.abs(speedX);
                    else if (posX <= 0) speedX = Math.abs(speedX);
                }

                if (boundsH > wmH) {
                    if (posY + wmH >= boundsH) speedY = -Math.abs(speedY);
                    else if (posY <= 0) speedY = Math.abs(speedY);
                }

                posX += speedX;
                posY += speedY;

                // Round to whole physical pixels to eliminate subpixel shimmering and scaling artifacts
                watermarkEl.style.transform = `translate3d(${Math.round(posX)}px, ${Math.round(posY)}px, 0)`;
                requestAnimationFrame(patrolWatermark);
            }
            requestAnimationFrame(patrolWatermark);

            window.addEventListener('resize', () => {
                const boundsW = container.clientWidth;
                const boundsH = container.clientHeight;
                const wmW = watermarkEl.offsetWidth;
                const wmH = watermarkEl.offsetHeight;
                if (boundsW > wmW) posX = Math.min(Math.max(0, posX), boundsW - wmW);
                if (boundsH > wmH) posY = Math.min(Math.max(0, posY), boundsH - wmH);
            });

            watermarkObserver = new MutationObserver(() => {
                checkWatermarkIntegrity();
            });
            watermarkObserver.observe(container, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ['style', 'class', 'id', 'hidden'],
                characterData: true
            });

            watermarkWatchdog = setInterval(() => {
                if (isPlaybackTerminated) {
                    clearInterval(watermarkWatchdog);
                    return;
                }
                checkWatermarkIntegrity();
            }, 250);
        }

    </script>
</body>
