<html>

<head>
    <title>Cinematic Break • {{ session.movie_title }}</title>
    <link rel="icon" href="data:,">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <link rel="stylesheet" href="/static/main.css">
</head>

<body class="player-body">
    <video id="mediaPlayer" class="player-video" playsinline crossorigin="anonymous">
        Your browser does not support HTML video.
    </video>

    <div id="loadingSpinner" class="loading-spinner">
        <i data-lucide="loader-circle"></i>
    </div>

    {% if ticket_number %}
    <div id="watermark" class="watermark-overlay">{{ ticket_number }}</div>
    {% endif %}

    <div id="playerOverlay" class="player-overlay pointer-events-none">
        <div class="pointer-events-auto player-header">
            <div style="flex: 1;">
                <h1 class="player-title">{{ session.movie_title }}</h1>
                {% if session.theater_number and session.theater_number != 'None' %}
                <div class="player-subtitle">Theater {{ session.theater_number }}</div>
                {% endif %}
            </div>
            <a href="#" onclick="window.close(); window.location.href='/'; return false;" class="player-close-btn"
                title="Close Player">
                <i data-lucide="x"></i>
            </a>
        </div>

        <div class="player-controls pointer-events-auto">


            <div class="controls-row">
                <div class="controls-left">
                    <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
                </div>

                <div class="controls-center">
                    <button class="control-btn play-btn-large" id="playPauseBtn">
                        <i data-lucide="pause" id="playIcon"></i>
                    </button>
                </div>

                <div class="controls-right">
                    <div class="volume-container flex align-center" style="gap: 5px;">
                        <button class="control-btn" id="muteBtn" onclick="toggleMute()">
                            <i data-lucide="volume-2" id="volumeIcon"></i>
                        </button>
                        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05"
                            value="1">
                    </div>
                    <button class="control-btn" id="aspectRatioBtn" onclick="toggleAspectRatio()"
                        title="Aspect Ratio: Fit">
                        <i data-lucide="rectangle-horizontal"></i>
                    </button>
                    <button class="control-btn" id="fullscreenBtn">
                        <i data-lucide="maximize"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        lucide.createIcons();

        const video = document.getElementById('mediaPlayer');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const playBtn = document.getElementById('playPauseBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const muteBtn = document.getElementById('muteBtn');

        let serverElapsed = parseInt("{{ session.elapsed_seconds }}", 10) || 0;
        let lastSyncLocalTime = Date.now();
        const duration = parseInt("{{ session.duration_seconds }}", 10) || 7200;
        let isAdminPaused = {{ 'true' if session.is_paused else 'false' }};

        let hasInitiallySeeked = false;

        function getLiveTime() {
            let actualDur = duration;
            if (video.duration && !isNaN(video.duration) && video.duration !== Infinity) {
                actualDur = Math.min(duration, video.duration);
            }
            if (isAdminPaused) {
                return Math.max(0, Math.min(actualDur, serverElapsed));
            }
            const now = Date.now();
            return Math.max(0, Math.min(actualDur, serverElapsed + (now - lastSyncLocalTime) / 1000));
        }

        const useHls = {{ 'true' if use_hls else 'false' }};
        const hlsUrl = `/static/hls/{{ session.id }}/index.m3u8?t=${Date.now()}`;
        const streamUrl = "/stream/{{ session.join_code }}";

        if (useHls) {
            function initHls() {
                if (Hls.isSupported()) {
                    const hls = new Hls({
                        startPosition: getLiveTime(),
                        manifestLoadingMaxRetry: 10,
                        manifestLoadingRetryDelay: 1000,
                        manifestLoadingTimeOut: 10000
                    });

                    let recoverDecodingErrorDate = null;
                    hls.on(Hls.Events.ERROR, function (event, data) {
                        if (data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    console.log("fatal network error encountered, try to recover");
                                    hls.startLoad();
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    console.log("fatal media error encountered, try to recover");
                                    const now = performance.now();
                                    if (!recoverDecodingErrorDate || (now - recoverDecodingErrorDate) > 3000) {
                                        recoverDecodingErrorDate = performance.now();
                                        hls.recoverMediaError();
                                    } else {
                                        console.error("Unrecoverable media error - destroying player");
                                        hls.destroy();
                                    }
                                    break;
                                default:
                                    hls.destroy();
                                    break;
                            }
                        }
                    });

                    hls.loadSource(hlsUrl);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function () {
                        if (!hasInitiallySeeked) {
                            hasInitiallySeeked = true;
                            video.play().catch(e => console.log("Auto-play prevented", e));
                        }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = hlsUrl;
                    video.addEventListener('loadedmetadata', () => {
                        if (!hasInitiallySeeked) {
                            video.currentTime = getLiveTime();
                            hasInitiallySeeked = true;
                            video.play().catch(e => console.log("Auto-play prevented", e));
                        }
                    });
                }
            }

            // Poll until the manifest is generated by ffmpeg
            function waitForManifest() {
                fetch(hlsUrl, { method: 'HEAD', cache: 'no-store' })
                    .then(response => {
                        if (response.ok) {
                            initHls();
                        } else {
                            setTimeout(waitForManifest, 1000);
                        }
                    })
                    .catch(() => setTimeout(waitForManifest, 1000));
            }
            waitForManifest();
        } else {
            video.src = streamUrl + "#t=" + getLiveTime();
            video.addEventListener('loadedmetadata', () => {
                if (!hasInitiallySeeked) {
                    video.currentTime = getLiveTime();
                    hasInitiallySeeked = true;
                    video.play().catch(e => console.log("Auto-play prevented", e));
                }
            });
        }

        video.addEventListener('waiting', () => loadingSpinner.style.opacity = '1');
        video.addEventListener('playing', () => loadingSpinner.style.opacity = '0');
        video.addEventListener('canplay', () => loadingSpinner.style.opacity = '0');

        function togglePlay() {
            if (isAdminPaused) return; // Ignore user play/pause if admin paused
            if (video.paused) {
                // Ensure we don't play past live time and resync
                if (typeof seekFailed === 'undefined' || !seekFailed) {
                    const live = getLiveTime();
                    if (Math.abs(video.currentTime - live) > 2) {
                        video.currentTime = live;
                    }
                }
                video.play();
            } else {
                video.pause();
            }
        }

        playBtn.addEventListener('click', togglePlay);
        video.addEventListener('click', togglePlay);

        video.addEventListener('play', () => {
            playBtn.innerHTML = '<i data-lucide="pause"></i>';
            lucide.createIcons();
        });
        video.addEventListener('pause', () => {
            playBtn.innerHTML = '<i data-lucide="play"></i>';
            lucide.createIcons();
        });

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return "0:00";
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        let lastSyncTime = 0;
        let seekFailed = false;

        // Live syncing check
        video.addEventListener('timeupdate', () => {
            if (seekFailed) return;

            const liveTime = getLiveTime();
            let actualDur = duration;

            if (liveTime >= actualDur - 1) return;

            // Force sync if we deviate by more than 5 seconds from server live time
            if (!video.paused && !video.seeking && Math.abs(video.currentTime - liveTime) > 5) {
                if (Date.now() - lastSyncTime > 10000) {
                    const targetTime = liveTime;
                    video.currentTime = targetTime;
                    lastSyncTime = Date.now();

                    setTimeout(() => {
                        if (!video.seeking && Math.abs(video.currentTime - targetTime) > 5) {
                            console.warn("Seek failed. Disabling live sync to prevent loop.");
                            seekFailed = true;
                        }
                    }, 3000);
                }
            }

            // Always show LIVE
            timeDisplay.innerHTML = `${formatTime(video.currentTime)} / ${formatTime(actualDur)} <span style="color: #e50914; margin-left: 10px; font-weight: bold;">• LIVE</span>`;
        });

        volumeSlider.addEventListener('input', (e) => {
            video.volume = e.target.value;
            video.muted = video.volume === 0;
            updateVolumeIcon();
        });

        function toggleMute() {
            video.muted = !video.muted;
            if (video.muted) {
                volumeSlider.value = 0;
            } else {
                if (video.volume === 0) video.volume = 1;
                volumeSlider.value = video.volume;
            }
            updateVolumeIcon();
        }

        function updateVolumeIcon() {
            let icon = 'volume-2';
            if (video.muted || video.volume == 0) icon = 'volume-x';
            else if (video.volume < 0.5) icon = 'volume-1';
            muteBtn.innerHTML = `<i data-lucide="${icon}"></i>`;
            lucide.createIcons();
        }

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        });

        document.addEventListener('fullscreenchange', () => {
            const icon = document.fullscreenElement ? 'minimize' : 'maximize';
            fullscreenBtn.innerHTML = `<i data-lucide="${icon}"></i>`;
            lucide.createIcons();
        });

        const overlay = document.getElementById('playerOverlay');
        let hideTimeout;
        function showOverlay() {
            overlay.style.opacity = '1';
            document.body.style.cursor = 'default';
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                if (!video.paused) {
                    overlay.style.opacity = '0';
                    document.body.style.cursor = 'none';
                }
            }, 3000);
        }
        document.addEventListener('mousemove', showOverlay);
        video.addEventListener('pause', showOverlay);
        showOverlay();

        const aspectModes = ['contain', 'cover', 'fill'];
        const aspectNames = ['Fit', 'Crop', 'Stretch'];
        let currentAspect = 0;

        function toggleAspectRatio() {
            currentAspect = (currentAspect + 1) % aspectModes.length;
            video.style.objectFit = aspectModes[currentAspect];
            const btn = document.getElementById('aspectRatioBtn');
            btn.title = 'Aspect Ratio: ' + aspectNames[currentAspect];

            // Show overlay notification
            const notification = document.createElement('div');
            notification.className = 'aspect-notification';
            notification.innerText = 'Aspect Ratio: ' + aspectNames[currentAspect];
            document.getElementById('playerOverlay').appendChild(notification);
            setTimeout(() => {
                notification.style.opacity = '0';
                setTimeout(() => notification.remove(), 500);
            }, 1500);
        }

        // Prevent default spacebar scrolling and use for play/pause
        window.addEventListener('keydown', function (e) {
            if (e.keyCode == 32 && e.target == document.body) {
                e.preventDefault();
                togglePlay();
            }
        });

        // Admin pause overlay
        const adminPauseOverlay = document.createElement('div');
        adminPauseOverlay.className = 'admin-pause-overlay';
        adminPauseOverlay.innerHTML = '<i data-lucide="pause-circle" style="width: 48px; height: 48px; margin-right: 15px;"></i> Session Paused by Admin';
        adminPauseOverlay.style.display = 'none';
        document.getElementById('playerOverlay').appendChild(adminPauseOverlay);
        lucide.createIcons();

        function updateAdminPauseState(paused) {
            isAdminPaused = paused;
            if (paused) {
                video.pause();
                adminPauseOverlay.style.display = 'flex';
                playBtn.disabled = true;
                playBtn.style.opacity = '0.5';
            } else {
                adminPauseOverlay.style.display = 'none';
                playBtn.disabled = false;
                playBtn.style.opacity = '1';
                // re-sync video to new live time
                video.currentTime = getLiveTime();
                video.play().catch(e => console.log("Auto-play prevented", e));
            }
        }

        if (isAdminPaused) {
            updateAdminPauseState(true);
        }

        let latencyHistory = [];
        const MAX_HISTORY = 5;

        setInterval(async () => {
            try {
                const requestStart = Date.now();
                const res = await fetch(`/sessions/{{ session.id }}/state`, { credentials: 'same-origin' });

                if (res.ok) {
                    const data = await res.json();
                    const requestEnd = Date.now();
                    const wasPaused = isAdminPaused;

                    const rtt = requestEnd - requestStart;
                    const oneWayLatency = rtt / 2;

                    latencyHistory.push(oneWayLatency);
                    if (latencyHistory.length > MAX_HISTORY) latencyHistory.shift();
                    const avgLatency = latencyHistory.reduce((a, b) => a + b, 0) / latencyHistory.length;

                    console.log(`[Sync] RTT: ${rtt}ms | One-Way Latency: ${oneWayLatency}ms | Smoothed Avg Latency: ${Math.round(avgLatency)}ms`);

                    serverElapsed = data.elapsed_seconds + (avgLatency / 1000);
                    lastSyncLocalTime = requestEnd;

                    if (data.is_paused !== wasPaused) {
                        updateAdminPauseState(data.is_paused);
                    } else if (!data.is_paused) {
                        const live = getLiveTime();
                        if (!video.paused && !video.seeking && Math.abs(video.currentTime - live) > 5) {
                            video.currentTime = live;
                        }
                    }
                } else if (res.status === 403) {
                    const data = await res.json();
                    document.body.innerHTML = `<div class="session-ended-overlay"><i data-lucide="shield-alert" class="icon-large"></i><h2 style="color: #e50914;">Access Revoked</h2><p>${data.detail || 'Your access has been terminated.'}</p></div>`;
                    lucide.createIcons();
                    if (typeof hls !== 'undefined') hls.destroy();
                    video.src = '';
                } else if (res.status === 404) {
                    document.body.innerHTML = '<div class="session-ended-overlay"><i data-lucide="video-off" class="icon-large"></i><h2>Session Ended</h2><p>This session has been terminated by the administrator.</p></div>';
                    lucide.createIcons();
                    if (typeof hls !== 'undefined') hls.destroy();
                    video.src = '';
                }
            } catch (e) {
                console.error("Failed to poll session state", e);
            }
        }, 5000);

        // Bouncing Watermark & Anti-Tamper
        const ticketNum = "{{ ticket_number }}";
        let watermark = document.getElementById('watermark');

        function createWatermark() {
            if (document.getElementById('watermark')) return document.getElementById('watermark');
            const el = document.createElement('div');
            el.id = 'watermark';
            el.className = 'watermark-overlay';
            el.innerText = ticketNum;
            document.body.appendChild(el);
            return el;
        }

        if (ticketNum) {
            function moveWatermark() {
                if (!watermark) watermark = createWatermark();
                const maxX = window.innerWidth - watermark.clientWidth - 20;
                const maxY = window.innerHeight - watermark.clientHeight - 20;
                
                const newX = Math.max(10, Math.floor(Math.random() * maxX));
                const newY = Math.max(10, Math.floor(Math.random() * maxY));
                
                watermark.style.left = `${newX}px`;
                watermark.style.top = `${newY}px`;
                watermark.style.display = 'block';
                watermark.style.visibility = 'visible';
                watermark.style.opacity = '1';
            }
            
            // Initial position and start interval
            moveWatermark();
            setInterval(moveWatermark, 3000);
            window.addEventListener('resize', moveWatermark);

            // Anti-Tamper Observer
            const observer = new MutationObserver(() => {
                if (!document.getElementById('watermark')) {
                    console.warn("Watermark tampering detected. Re-engaging.");
                    watermark = createWatermark();
                    fetch(`/sessions/{{ session.id }}/ban`, { method: 'POST' });
                }
            });
            observer.observe(document.body, { childList: true, subtree: true });
            
            // Aggressive interval check in case observer is bypassed
            setInterval(() => {
                let tampered = false;
                if (!document.getElementById('watermark')) {
                    watermark = createWatermark();
                    tampered = true;
                } else {
                    const style = window.getComputedStyle(watermark);
                    if (style.display === 'none' || style.visibility === 'hidden' || parseFloat(style.opacity) < 0.1) {
                        watermark.style.display = 'block';
                        watermark.style.visibility = 'visible';
                        watermark.style.opacity = '1';
                        tampered = true;
                    }
                }
                if (tampered) {
                    fetch(`/sessions/{{ session.id }}/ban`, { method: 'POST' });
                }
            }, 1000);
        }

    </script>
</body>

</html>
