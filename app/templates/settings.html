{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2 class="mt-0">Network & Remote Access</h2>
    <p style="color: var(--text-secondary); font-size: 0.9em;" class="mb-15">Configure your external URL or Domain Name. This ensures QR codes and invite links work outside your local network.</p>
    <form action="/settings" method="post" class="flex gap-15 align-center m-0">
        <div class="flex-1" style="position: relative;">
            <input type="text" name="external_dns" id="external_dns"
                placeholder="e.g. example.com" value="{{ settings.get('external_dns', '') }}" class="w-full m-0" style="padding: 12px; border: none; border-radius: 4px; background: var(--bg-senary); color: var(--text-primary); box-sizing: border-box;">
        </div>
        <button type="submit" class="btn m-0" style="min-width: 100px;">Save</button>
    </form>
</div>
{% endblock %}
