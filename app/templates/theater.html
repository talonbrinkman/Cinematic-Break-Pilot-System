<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theater {{ theater_number }} - Cinematic Break</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/main.css">
    <style>
        .theater-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: var(--padding-lg);
            text-align: center;
        }

        .theater-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: var(--accent);
            margin-bottom: var(--margin-xs);
        }

        .theater-subtitle {
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: var(--text-muted);
            margin-bottom: var(--margin-xl);
        }

        .theater-qr-card {
            background-color: var(--surface);
            border: 1px solid var(--surface-hover);
            padding: var(--padding-xl);
            border-radius: var(--radius-lg);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--gap-md);
        }

        .theater-qr-img {
            width: clamp(200px, 40vw, 320px);
            height: clamp(200px, 40vw, 320px);
            border-radius: var(--radius);
            image-rendering: -webkit-optimize-contrast;
            image-rendering: pixelated;
        }

        .theater-join-code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: clamp(1.6rem, 4vw, 2.6rem);
            letter-spacing: 0.2em;
            background: var(--bg);
            border: 1px solid var(--surface-hover);
            padding: 0.3em 0.8em;
            border-radius: var(--radius);
            color: var(--text);
            width: 100%;
        }

        .theater-hint {
            margin-top: var(--margin-xl);
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--text-muted);
        }

        .theater-empty {
            color: var(--text-dim);
            font-style: italic;
        }
    </style>
</head>
<body class="theater-body">
    {% if session %}
    <h1 class="theater-title">{{ session.movie_title }}</h1>
    <h2 class="theater-subtitle">Theater {{ theater_number }}</h2>
    <div class="theater-qr-card">
        <img src="/sessions/{{ session.id }}/qr" alt="Join Code QR" class="theater-qr-img" />
        <div class="theater-join-code">{{ session.join_code }}</div>
    </div>
    <p class="theater-hint">Scan the QR code or enter code to join on your device</p>
    {% else %}
    <h2 class="theater-subtitle">Theater {{ theater_number }}</h2>
    <h1 class="theater-empty">No Active Session</h1>
    <p class="theater-hint">Please wait for the next presentation to begin.</p>
    {% endif %}

    <script>
        setInterval(() => {
            window.location.reload();
        }, 30000);
    </script>
</body>
</html>
